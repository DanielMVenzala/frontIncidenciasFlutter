name: front_incidencias
description: "Aplicación móvil para gestión de incidencias municipales."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # HTTP client
  dio: ^5.8.0+1

  # Navigation
  go_router: ^14.6.3

  # Secure storage (JWT token)
  flutter_secure_storage: ^9.2.4

  # Image handling
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Tipografía
  google_fonts: ^6.2.1

  # Material icons
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.16.0
  fl_chart: ^1.2.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
